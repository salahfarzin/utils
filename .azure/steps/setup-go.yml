# Installs the Go version pinned in go.mod, restores the module cache and
# downloads dependencies. Equivalent of actions/setup-go with
# go-version-file + cache.
steps:
  - bash: |
      GO_VERSION=$(awk '/^go /{print $2}' go.mod)
      echo "Go version from go.mod: ${GO_VERSION}"
      echo "##vso[task.setvariable variable=GO_VERSION]${GO_VERSION}"
    displayName: Read Go version from go.mod

  - task: GoTool@0
    displayName: Set up Go $(GO_VERSION)
    inputs:
      version: $(GO_VERSION)

  - task: Cache@2
    displayName: Cache Go modules
    inputs:
      key: 'gomod | "$(Agent.OS)" | go.sum'
      restoreKeys: |
        gomod | "$(Agent.OS)"
      path: $(GOMODCACHE)

  # `go test -race` needs cgo, and the Dev agent image ships without a C
  # compiler. Installed once; it persists until the agent image is rebuilt.
  - bash: |
      if ! command -v gcc >/dev/null; then
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends gcc libc6-dev
      fi
    displayName: Ensure C toolchain

  - bash: go mod download
    displayName: Download dependencies
