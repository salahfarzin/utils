# The QC gate: formatting · module hygiene · static analysis · linting, and the
# tests with race detector + coverage. Both jobs run in parallel, as far as the
# pool has agents free. The tests need no database or broker.
stages:
  - stage: Checks
    displayName: Quality, Tests & Coverage
    jobs:
      - job: Quality
        displayName: Quality Checks
        steps:
          - template: ../steps/setup-go.yml

          - bash: |
              if [ -n "$(gofmt -l .)" ]; then
                echo "❌ Formatting issues found:"
                gofmt -l .
                echo "Run 'gofmt -w .' to fix"
                exit 1
              fi
              echo "✅ gofmt OK"
            displayName: Check formatting (gofmt)

          - bash: |
              go mod tidy
              git diff --exit-code go.mod go.sum \
                || (echo "❌ Run 'go mod tidy' and commit the result"; exit 1)
            displayName: Check go.mod is tidy

          # Consumers build against released versions; a replace pointing at a
          # local path would only build on the author's machine.
          - bash: |
              ! go mod edit -json | grep -A1 '"New": {' | grep -E '"Path": "(\.|/)' \
                || (echo "❌ go.mod replaces a module with a local path"; exit 1)
            displayName: Released modules only (no local replace)

          - bash: go vet ./...
            displayName: Static analysis (go vet)

          - bash: go build ./...
            displayName: Build

          - bash: |
              go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
              "$(go env GOPATH)/bin/golangci-lint" run --timeout=5m
            displayName: Lint (golangci-lint)

      - job: Test
        displayName: Tests & Coverage
        steps:
          - template: ../steps/setup-go.yml

          - bash: |
              mkdir -p coverage
              go test -v -race \
                -covermode=atomic \
                -coverprofile=coverage/coverage.out \
                ./...
            displayName: Run tests with coverage

          - bash: |
              COVERAGE=$(go tool cover -func=coverage/coverage.out | grep total | awk '{print $3}' | sed 's/%//')
              echo "Total coverage: ${COVERAGE}%"
              echo "##vso[task.setvariable variable=coverage]${COVERAGE}"
              go tool cover -html=coverage/coverage.out -o coverage/coverage.html
            displayName: Coverage report

          - publish: coverage
            artifact: coverage-report
            displayName: Upload coverage report

          - bash: |
              if [ -z "$CODECOV_TOKEN" ] || [[ "$CODECOV_TOKEN" == '$('* ]]; then
                echo "CODECOV_TOKEN not set — skipping Codecov upload"
                exit 0
              fi
              curl -Os https://cli.codecov.io/latest/linux/codecov
              chmod +x codecov
              ./codecov upload-process -t "$CODECOV_TOKEN" -f coverage/coverage.out -F unittests
            displayName: Upload to Codecov
            continueOnError: true
            env:
              CODECOV_TOKEN: $(CODECOV_TOKEN)
