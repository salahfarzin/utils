# =============================================================================
# JOB TEMPLATE: SonarQube analysis
# =============================================================================
# Sends this repo's analysis — issues plus the Test job's coverage — to the
# self-hosted SonarQube on the dev host that the main app also reports to.
# The server is long-lived and deployed separately (ansible repo:
# azure-pipelines-sonarqube.yml / deploy-sonarqube.yml); this job only uploads
# to it. What gets analyzed is configured in sonar-project.properties.
#
# Every branch and every PR (not v* tags: those are commits main/dev already
# analyzed). The server runs the community branch plugin, so each gets its own
# analysis instead of overwriting dev's:
#   - PR builds     -> pull request analysis (new code = the PR's diff)
#   - branch builds -> branch analysis, named after the branch
#
# The server isn't public: this agent drives the dev host's docker daemon over
# a shared socket, so the scanner container is started on that daemon inside
# the sonarqube_net network and reaches the server by container name. -v bind
# mounts don't work over that socket (they'd resolve on the daemon's
# filesystem, not this agent's), hence docker create + docker cp.
#
# Needs SONAR_TOKEN as a secret pipeline variable (a Global Analysis Token).
# Without it the job warns and skips instead of failing. continueOnError so an
# unreachable or upgrading SonarQube never blocks a release.
# =============================================================================

jobs:
  - job: SonarQube
    displayName: SonarQube Analysis
    # After Test, for its coverage. succeededOrFailed: failing tests still get
    # analyzed, with whatever coverage they wrote.
    dependsOn:
      - Test
    condition: and(succeededOrFailed(), not(startsWith(variables['Build.SourceBranch'], 'refs/tags/')))
    continueOnError: true
    steps:
      # Full history: SonarQube uses git blame to tell new code from old, and
      # diffs against the PR target; a shallow clone makes every line "new".
      - checkout: self
        clean: true
        fetchDepth: 0

      - task: DownloadPipelineArtifact@2
        displayName: Download coverage report
        continueOnError: true
        inputs:
          artifact: coverage-report
          path: $(Build.SourcesDirectory)/coverage

      - bash: |
          set -euo pipefail

          # An undefined pipeline variable is passed through literally as
          # "$(SONAR_TOKEN)", not as an empty string.
          case "${SONAR_TOKEN:-}" in
            ''|'$('*)
              echo "##vso[task.logissue type=warning]SONAR_TOKEN pipeline variable is not set - skipping SonarQube analysis"
              exit 0
              ;;
          esac

          if [ "$BUILD_REASON" = "PullRequest" ]; then
            SCOPE_ARGS=(
              "-Dsonar.pullrequest.key=$SYSTEM_PULLREQUEST_PULLREQUESTID"
              "-Dsonar.pullrequest.branch=${SYSTEM_PULLREQUEST_SOURCEBRANCH#refs/heads/}"
              "-Dsonar.pullrequest.base=${SYSTEM_PULLREQUEST_TARGETBRANCH#refs/heads/}"
            )
          else
            SCOPE_ARGS=("-Dsonar.branch.name=${BUILD_SOURCEBRANCH#refs/heads/}")
          fi
          echo "Analysis scope: ${SCOPE_ARGS[*]}"

          # go test names files by import path (github.com/salahfarzin/utils/
          # middlewares/auth.go); the scanner sees them relative to the repo
          # root. Unrewritten, SonarQube matches no file and silently reports
          # 0% coverage.
          cd "$(Build.SourcesDirectory)"
          MODULE=$(awk '/^module /{print $2; exit}' go.mod)
          if [ -s coverage/coverage.out ]; then
            sed -i "s#^${MODULE}/##" coverage/coverage.out
          else
            echo "##vso[task.logissue type=warning]No coverage report found - SonarQube will show 0% coverage"
          fi

          # Memory: capped as for the main app, on a host shared with dev,
          # demo and SonarQube itself.
          CID=$(docker create \
            --network sonarqube_net \
            --memory 2g \
            -e SONAR_SCANNER_JAVA_OPTS=-Xmx512m \
            -e SONAR_HOST_URL=http://sonarqube:9000 \
            -e SONAR_TOKEN \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/usr/src \
            sonarsource/sonar-scanner-cli:12.2 \
            "${SCOPE_ARGS[@]}")
          trap 'docker rm -f "$CID" >/dev/null' EXIT

          # docker cp keeps this agent's uid on the files, which isn't the
          # scanner image's user; git would then refuse the repo as "dubious
          # ownership" and new-code detection would degrade. GIT_CONFIG_* above
          # marks /usr/src safe inside the container.
          docker cp "$(Build.SourcesDirectory)/." "$CID:/usr/src"
          docker start -a "$CID"
        displayName: Run SonarQube scanner
        env:
          SONAR_TOKEN: $(SONAR_TOKEN)
