---
name: CI

on:
  push:
    branches: [main, dev, 'feature/**']
    tags: ['v*']
  pull_request:
    branches: [main, dev]

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. Quality: formatting · static analysis · linting · module hygiene
  # ──────────────────────────────────────────────────────────────────────────
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Check formatting (gofmt)
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "❌ Formatting issues found:"
            gofmt -l .
            echo "Run 'gofmt -w .' to fix"
            exit 1
          fi
          echo "✅ gofmt OK"

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum \
            || (echo "❌ Run 'go mod tidy' and commit the result"; exit 1)

      # Consumers build against released versions; a replace pointing at a local
      # path would only build on the author's machine.
      - name: Released modules only (no local replace)
        run: |
          ! go mod edit -json | grep -A1 '"New": {' | grep -E '"Path": "(\.|/)' \
            || (echo "❌ go.mod replaces a module with a local path"; exit 1)

      - name: Static analysis (go vet)
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Lint (golangci-lint)
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          golangci-lint run --timeout=5m

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Tests & Coverage
  # ──────────────────────────────────────────────────────────────────────────
  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests with coverage
        run: |
          mkdir -p coverage
          go test -v -race \
            -covermode=atomic \
            -coverprofile=coverage/coverage.out \
            ./...

      - name: Coverage report
        run: |
          COVERAGE=$(go tool cover -func=coverage/coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          echo "coverage=${COVERAGE}" >> "$GITHUB_ENV"
          go tool cover -html=coverage/coverage.out -o coverage/coverage.html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/coverage.out
          flags: unittests
          fail_ci_if_error: false
