# SonarQube analysis settings, read by the SonarQube steps of the GitHub
# Actions test job (.github/workflows/ci.yml) and by the Azure SonarQube job
# (.azure/jobs/sonarqube.yml). The project is created on the server by its
# first analysis.
sonar.projectKey=utils
sonar.projectName=Utils

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.sourceEncoding=UTF-8

# Tests are analyzed as tests, not as sources. Logs written by local test
# runs and the coverage output aren't code.
sonar.exclusions=\
  **/*_test.go,\
  **/testdata/**,\
  **/logs/**,\
  coverage/**

# Coverage from the test run's go test -coverprofile, with its import-path
# file names rewritten to repo-relative ones before the scan.
sonar.go.coverage.reportPaths=coverage/coverage.out

# Analyzed for bugs and smells, but not counted for coverage: helpers that
# exist only for other modules' tests.
sonar.coverage.exclusions=\
  testutils/**
