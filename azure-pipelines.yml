# =============================================================================
# Azure DevOps Pipeline - utils (shared Go library)
# =============================================================================
#   Checks: quality and test jobs in parallel, then a SonarQube analysis
#   (never blocking). No build, image or deploy stages: services consume utils
#   as a released module version.
#
# Templates live in .azure/
#   stages/   checks.yml
#   jobs/     sonarqube.yml
#   steps/    setup-go.yml
#
# Optional secret variables: CODECOV_TOKEN; SONAR_TOKEN (SonarQube Global
# Analysis Token, as auth's; without it the analysis is skipped)
#
# Azure Repos ignores the `pr:` keyword: to run this on pull requests, add a
# Build Validation branch policy on main / dev pointing at this pipeline.
# =============================================================================

trigger:
  branches:
    include:
      - main
      - dev
      - feature/*
  tags:
    include:
      - v*

pr:
  branches:
    include:
      - main
      - dev

variables:
  GOMODCACHE: $(Pipeline.Workspace)/.gomod

# Self-hosted, same as auth and notification.
pool: Dev

stages:
  - template: .azure/stages/checks.yml
